name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Google Chrome, not bundled Chromium: WebCodecs needs Chrome's H.264 and AAC support.
      # GitHub's Ubuntu images ship Chrome already; install it only if missing.
      - name: Ensure Google Chrome
        run: google-chrome --version || npx playwright install --with-deps chrome
      - run: npm run test:e2e -- --project=chrome

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chrome
          path: playwright-report
          retention-days: 7

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  webkit:
    name: Browser tests in WebKit
    # macOS, so WebKit decodes and encodes media with the same system frameworks Safari uses.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=webkit

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, webkit]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
